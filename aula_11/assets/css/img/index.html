<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <div class="form-cadastro">
        <form action="" method="get">
<label for="nome">Nome Completo</label> <br>
<input type="text" name="nome completo" > <br>
<label for="senha"></label> <br>
<input type="password" name="senha" minlength="8" required> <br>
<label for="data de nascimento">Data de nascimento</label> <br>
<input type="date" name="data de nascimento"> <br>
<label for="descrição">Fale sobre você</label> <br>
<input type="text" name="descrição"> <br>
<textarea name="descrição" rows="S" cols="10"></textarea> <br>
<label for="telefone">Telefone</label> <br>
<input type="tell" name="telefone"> <br>
<label for="foto">Foto de perfil</label> <br>
<input type="file" name="foto" size="10mb" accept=".pdf" id=""> <br>
<label for="email">Email</label> <br>
<input type="email" name="email" id=""> <br>
<button type="submit">Enviar formulario</button> <br>



        </form>

    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
