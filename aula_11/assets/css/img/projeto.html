<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Formulário Senac</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <header>
      <img src="./image.png" alt="Logotipo do Senac" />
    </header>

    <main>
      <div class="form-cadastro">
        <h1>Formulário Senac</h1>

        <form action="" method="post">
          <div class="uma-coluna">
            <label for="nome">Nome completo</label>

            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Digite seu nome completo"
              autocomplete="name"
              required
            />
          </div>

          <div class="duas-coluna">
            <label for="cpf">CPF</label>

            <input
              type="text"
              id="cpf"
              name="cpf"
              placeholder="000.000.000-00"
              maxlength="14"
              inputmode="numeric"
              required
            />
            <label for="dataNascimento"> Data de nascimento </label>

            <input
              type="date"
              id="dataNascimento"
              name="dataNascimento"
              required
            />
          </div>

          <div class="duas-colunas">
            <label for="telefone">Contato telefônico</label>

            <input
              type="tel"
              id="telefone"
              name="telefone"
              placeholder="(00) 00000-0000"
              maxlength="15"
              autocomplete="tel"
              required
            />

            <label for="email">E-mail</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="exemplo@email.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="duas-colunas">
            <label for="cep">CEP</label>

            <input
              type="text"
              id="cep"
              name="cep"
              placeholder="00000-000"
              maxlength="9"
              inputmode="numeric"
              autocomplete="postal-code"
              required
            />
            <label for="rua">Rua</label>

            <input
              type="text"
              id="rua"
              name="rua"
              placeholder="Digite o nome da rua"
              abel
            />
          </div>

          <div class="três-colunas">
            <label for="Número">Número</label>
            <input
              type="text"
              id="numero"
              name="numero"
              placeholder="Ex.: 150"
              inputmode="numeric"
              required
            />
            <label for="complemento">Complemento</label>

            <input
              type="text"
              id="complemento"
              name="complemento"
              placeholder="Apartamento, bloco ou referência"
              autocomplete="address-line2"
            />
            <label for="bairro">Bairro</label>

            <input
              type="text"
              id="bairro"
              name="bairro"
              placeholder="Digite seu bairro"
              required
            />
          </div>

          <div class="duas-colunas">
            <label for="cidade">Cidade</label>

            <input
              type="text"
              id="cidade"
              name="cidade"
              placeholder="Digite sua cidade"
              autocomplete="address-level2"
              required
            />

            <label for="estado">Estado (UF)</label>

            <select
              id="estado"
              name="estado"
              autocomplete="address-level1"
              required
            >
              <option value="" selected disabled>Selecione</option>

              <option value="AC">AC</option>
              <option value="AL">AL</option>
              <option value="AP">AP</option>
              <option value="AM">AM</option>
              <option value="BA">BA</option>
              <option value="CE">CE</option>
              <option value="DF">DF</option>
              <option value="ES">ES</option>
              <option value="GO">GO</option>
              <option value="MA">MA</option>
              <option value="MT">MT</option>
              <option value="MS">MS</option>
              <option value="MG">MG</option>
              <option value="PA">PA</option>
              <option value="PB">PB</option>
              <option value="PR">PR</option>
              <option value="PE">PE</option>
              <option value="PI">PI</option>
              <option value="RJ">RJ</option>
              <option value="RN">RN</option>
              <option value="RS">RS</option>
              <option value="RO">RO</option>
              <option value="RR">RR</option>
              <option value="SC">SC</option>
              <option value="SP">SP</option>
              <option value="SE">SE</option>
              <option value="TO">TO</option>
            </select>
          </div>

          <div class="três-colunas">
            <label for="escolaridade">Escolaridade</label>

            <select id="escolaridade" name="escolaridade" required>
              <option value="" selected disabled>Selecione uma opção</option>

              <option value="fundamental">Ensino Fundamental</option>

              <option value="medio">Ensino Médio</option>

              <option value="superior">Ensino Superior</option>
            </select>
            <label for="sexo">Sexo</label>

            <select id="sexo" name="sexo" required>
              <option value="" selected disabled>Selecione uma opção</option>

              <option value="masculino">Masculino</option>

              <option value="feminino">Feminino</option>

              <option value="nao-informar">Prefiro não informar</option>
            </select>

            <button type="submit">Enviar cadastro</button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
